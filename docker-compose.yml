version: '3.8'

services:
  pokemoncito:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pokemoncito-app
    ports:
      - "8501:8501"
    volumes:
      # Mount checkpoints directory for persistence
      - ./PokemonRL/checkpoints:/app/PokemonRL/checkpoints
      # Mount data directory
      - ./data:/app/data
      - ./PokemonRL/data:/app/PokemonRL/data
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    restart: unless-stopped
    stdin_open: true
    tty: true
